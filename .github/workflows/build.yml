name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: core (protocol, CLI, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and package the CLI
        run: ./gradlew :core:test :core:distZip --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: instax-print-cli
          path: core/build/distributions/*.zip

  android:
    name: android app (APK)
    runs-on: ubuntu-latest
    env:
      # Tag builds are named after the tag; every other build is a "nightly".
      APP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'nightly' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest ships the Android SDK with licences accepted; AGP downloads missing platforms itself.
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the signing key from the repository secrets
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$APP_KEYSTORE_BASE64" ]; then
            echo "$APP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "APP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository's release key."
          else
            echo "::warning::No APP_KEYSTORE_BASE64 secret: signing with a throw-away debug key. In-app updates will not install over this build. See the README, section Signature."
          fi
      - name: Build the signed release APK
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEY_ALIAS: ${{ secrets.APP_KEY_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Name the APK after its version and build number
        id: apk
        run: |
          NAME="pls-share-sp3-${APP_VERSION_NAME}-b${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Verify the APK (signature, manifest)
        run: |
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "${{ steps.apk.outputs.name }}"
          "$TOOLS/aapt2" dump badging "${{ steps.apk.outputs.name }}" | head -5
          sha256sum "${{ steps.apk.outputs.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: pls-share-sp3-apk
          path: ${{ steps.apk.outputs.name }}

      # Every push to the main development branch refreshes the rolling "nightly" pre-release,
      # so the APK is always one click away and the in-app updater can find it.
      - name: Move the nightly tag to this commit
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/')
        run: |
          git tag -f nightly
          git push -f origin nightly
      - name: Remove older APKs from the nightly pre-release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in $(gh release view nightly --json assets --jq '.assets[].name' 2>/dev/null); do
            gh release delete-asset nightly "$asset" --yes
          done
      - name: Publish the nightly pre-release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly build ${{ github.run_number }}
          prerelease: true
          body: |
            Build automatique du commit ${{ github.sha }} (branche `${{ github.ref_name }}`).
            Installez l'APK ci-dessous, ou laissez l'application se mettre à jour toute seule.
          files: ${{ steps.apk.outputs.name }}

      - name: Publish the tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
